[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textedit-accel"
version = "0.2.0"
description = "Single-H800 acceleration for Qwen-Image-Edit text replacement"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "torch>=2.2",
]

[project.optional-dependencies]
qwen = [
  "accelerate",
  "diffusers>=0.37",
  "protobuf",
  "sentencepiece",
  "transformers",
]
test = ["pytest>=8"]

[project.scripts]
textedit-accel = "textedit_accel.cli:main"
textedit-benchmark-h800 = "textedit_accel.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
